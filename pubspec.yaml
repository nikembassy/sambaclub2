name: sambaclub
description: "Sambaclub - live streaming app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  image_picker: ^1.2.3
  file_picker: ^8.0.0
  record: ^7.1.1
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  permission_handler: ^11.3.0
  web_socket_channel: ^3.0.3
  flutter_webrtc: ^1.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
